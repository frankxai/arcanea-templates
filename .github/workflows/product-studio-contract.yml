name: Product Studio contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Validate product contracts
        run: python scripts/validate_repository.py
