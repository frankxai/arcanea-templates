name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cosmic-landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/cosmic-landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No lockfile is committed for this template, so `npm ci` is impossible and
      # the install is not reproducible. That is a defect in the template, not here.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
